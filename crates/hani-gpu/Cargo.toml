[package]
name = "hani-gpu"
description = "wgpu device resources, buffer pools and the sculpt render pipeline for HaniSculpt."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
hani-core.workspace = true
bytemuck.workspace = true
glam.workspace = true
log.workspace = true
rustc-hash.workspace = true
wgpu.workspace = true

[dev-dependencies]
hani-core.workspace = true
glam.workspace = true
pollster.workspace = true
# The version wgpu already brings, for one test: that the sculpt shader
# translates to the GLSL ES 3.00 the browser build's WebGL2 runs.
naga = { version = "27", features = ["wgsl-in", "glsl-out"] }

[[bench]]
name = "render"
harness = false

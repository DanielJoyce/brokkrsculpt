# SPDX-License-Identifier: AGPL-3.0-only

[package]
name = "brokkr-core"
description = "Sparse brick volume, brushes and meshing for BrokkrSculpt. No UI or windowing dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Nothing in this crate may depend on a UI, windowing or GPU crate. That is
# what keeps the Iced choice reversible: swapping the shell touches brokkr-app
# only. CI enforces this with a dependency check.
[dependencies]
bytemuck.workspace = true
contracts.workspace = true
glam.workspace = true
rayon.workspace = true
roxmltree.workspace = true
rustc-hash.workspace = true
yazi.workspace = true
web-time.workspace = true

[dev-dependencies]
# The mesher this crate's own is held to, bit for bit. It was the mesher, and
# is no longer in a build: see `src/mesh/nets.rs`.
fast-surface-nets.workspace = true
glam.workspace = true
proptest.workspace = true

[[bench]]
name = "budget"
harness = false

[[bench]]
name = "scale"
harness = false

[[bench]]
name = "import"
harness = false

# The brush engine against the brush it stands beside. A ratio gate.
[[bench]]
name = "engine"
harness = false


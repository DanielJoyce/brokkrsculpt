# SPDX-License-Identifier: AGPL-3.0-only

[package]
name = "hani-app"
description = "HaniSculpt: a voxel and SDF based 3D sculpting application."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "hanisculpt"
path = "src/main.rs"

[dependencies]
hani-core.workspace = true
hani-gpu.workspace = true
contracts.workspace = true
glam.workspace = true
# `canvas` is the icon set, and it is the one feature of iced this project pays
# for. Measured against this lockfile: canvas adds SIX crates -- the `lyon`
# tessellator and `float_next_after` -- where `svg` adds THIRTY ONE (resvg,
# usvg, rustybuzz, and four raster decoders for bitmaps an icon never carries)
# and `image` adds seventy one. `logo.rs` predicted this trade in its own header
# and drew the mark out of `fill_quad` rectangles rather than take it early;
# fill_quad is axis-aligned rectangles only, which a 24px stroke icon with
# circles and diagonals cannot be made of. A whole icon set is what earns the
# six. See `icon.rs`.
# `markdown` is Help's pages (`app/help.rs`): pulldown-cmark, and nothing else
# new.
#
# iced's defaults are off in the workspace, and what is used of them is named
# here: wgpu, the X11 and Wayland backends, the thread pool tasks run on,
# crisp edges and the web colours. Left off: `linux-theme-detection` (41
# packages on Linux, a D-Bus stack, and the theme here is always our own),
# `tiny-skia` (a software renderer the viewport cannot draw with) and
# `debug` (iced's devtools, unused). See `docs/DEPENDENCIES.md`.
iced = { workspace = true, features = ["advanced", "wgpu", "canvas", "image-without-codecs", "markdown", "x11", "wayland", "thread-pool", "crisp", "web-colors"] }
# Pictures taken in: decals, stamps and a picture across a brush's tip.
# `default-features = false` is the whole point: iced's own `image` feature is `image-without-codecs` PLUS
# `image/default`, and it is the second half that brings AVIF, EXR, AV1 grain
# synthesis and fax decoding -- measured against this lockfile, +72 crates.
# The widget alone is +6 and these two decoders are +9: JPEG and PNG.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
log.workspace = true
# The core's own thread pool, already in the lockfile: what the application
# sizes at start (`app/cores.rs`) and spreads the decal preview's casts over.
rayon.workspace = true
serde_json = "1.0.151"
rfd.workspace = true
wgpu.workspace = true
# Vector displacement maps (app/maps.rs) are OpenEXR files, read by our own
# reader (`src/openexr.rs`), which inflates ZIP chunks with miniz_oxide:
# already here through png, so no new crate. It replaced `exr` and its six
# on 2026-11-27 (`docs/DEPENDENCIES.md`, proposal 6); `exr` stays as a
# dev-dependency, below, to write the test files.
miniz_oxide = "0.8"
web-time.workspace = true

# Native only: the folders settings live in, the updater, the bug report's
# one request and the printer's. None of them builds for the browser, where
# there are no such folders, no socket and no executable to replace. See
# `docs/WEB.md`.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dir_spec.workspace = true
# Not in a browser, where it is never started (`main.rs`).
env_logger.workspace = true
# A picture on the clipboard, for Snip and report (`app/snip.rs`): iced's
# own clipboard carries text only. Wayland's data-control protocol as well
# as X11, so a paste works in either session.
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
# The updater's signature check, and the only new crate the updater costs.
# ZERO transitive dependencies -- Ed25519 and Blake2b are implemented inline in
# about 2.5k lines, MIT. Version pinned exactly rather than caret-bounded:
# cargo has no release-age gate the way npm and bun do on this machine, so the
# lockfile diff for this one gets read by hand.
#
# `ed25519-dalek` was the alternative and is rejected: it gives a bare
# primitive, so the container format, the key-id check and the prehash would
# all have to be reinvented here, badly, in the one code path whose output gets
# made executable.
minisign-verify = "=0.2.5"
# SHA-256 for the update payload. **+0 compiled crates**: `ring 0.17.14` is
# already in the graph as rustls' backend (Cargo.lock:3040), so this is a
# declaration rather than a dependency -- but it IS a new direct line, because
# being in the lockfile does not let you `use` it.
#
# Hand-rolling SHA-256 here is forbidden. This tree has form for hand-rolling
# (FNV-1a in `report.rs`, the 3MF ZIP writer, the IOKit externs) and this is the
# single worst place in the codebase to be clever: it is the check that decides
# whether network bytes get the execute bit.
ring = "0.17"
# No HTTP library: the printer is asked over a socket of our own and the
# updater runs the system's `curl` (`src/net.rs`). `ureq`, rustls and its
# root certificates went on 2026-11-27 with the TinkerAtlas bug report, its
# third user (`docs/DEPENDENCIES.md`, proposal 4).

# Stylus pressure is read straight from the kernel's evdev interface. That sits
# below the display server, so one code path covers X11, XWayland and Wayland,
# and it works with any tablet the kernel has a driver for rather than a list of
# vendors. Nothing else in the stack can supply it: iced 0.14 drops winit's
# force field, and winit 0.30 only ever had it for touch.

# In a browser, a panic's message to the console: without it a panic there
# reads only "unreachable". Both already in the graph through winit.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }
# Opening and saving in a browser: its promises, awaited. See `web.rs`.
js-sys = "0.3"
wasm-bindgen-futures = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Our own, over libc, in place of the `evdev` crate. See `crates/hani-evdev`.
hani-evdev.workspace = true

# Blocks on wgpu's adapter and device futures, and nothing else. Needed because
# `SharedFrame::apply` orders a pool reset, a set of body deletions and a batch
# of uploads against each other, and getting that order wrong draws a deleted
# body forever with no counter moving -- so the test builds a real
# `SculptRenderer` rather than asserting against a stand-in that could agree
# with a wrong ordering. Costs zero new crates: `pollster` is already a
# workspace dependency and already compiled for `hani-gpu`'s own tests.
[dev-dependencies]
pollster.workspace = true
# Writes the OpenEXR files the reader is tested against, in every
# compression, so the reader is held to another implementation's output and
# not only to its own idea of the format. Tests only: none of it is in the
# application.
exr = { version = "1.74.3", default-features = false }
# Property tests, as in `hani-core`: what a brush kept in a file comes back
# as, whatever the brush. Zero new crates, for the same reason as above.
proptest.workspace = true

# `poke` is nothing but evdev: it writes synthetic pointer and key events to
# `/dev/uinput`. Opt-in rather than a `cfg` on each of its ten items, which
# would be ten attributes saying the same thing, and rather than a bare
# `cfg(target_os)` on the file, which cannot work because an example still
# needs a `main` on the platforms it is switched off for. Build it with
# `--features uinput`; `scripts/drive.py` is what drives the window day to day.
[features]
uinput = []

[[example]]
name = "poke"
required-features = ["uinput"]

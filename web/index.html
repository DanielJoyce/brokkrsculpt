<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HaniSculpt</title>
  <link rel="icon" type="image/png" href="icon.png">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #16181d; }
    /* Fingers are the application's (app/touch.rs): no pinch-zoom of the
       page, no scroll, no pull-to-refresh under a two-finger gesture. */
    html, body, canvas { touch-action: none; overscroll-behavior: none; }
    canvas { display: block; width: 100vw; height: 100vh; outline: none; }
    #note {
      position: fixed; inset: 0; display: grid; place-items: center;
      color: #e6e8ec; font: 15px/1.5 system-ui, sans-serif; text-align: center;
      padding: 16px;
    }
    #note b { color: #ff7a3c; }
    #note code { color: #ff7a3c; }
  </style>
</head>
<body>
  <div id="note"><div><img src="icon.png" alt="" width="96" height="96"><br>Loading <b>HaniSculpt</b>…</div></div>
  <script type="module">
    const note = document.getElementById("note");
    const icon = '<img src="icon.png" alt="" width="96" height="96"><br>';
    // Asked here, before the application starts, because a browser can have
    // WebGPU and still have no adapter for it (Chrome on Linux without its
    // flags, a blocked graphics driver). The application cannot run without
    // one, and iced would otherwise fall back to a software renderer that
    // fails on the same canvas with a message about a 2D context.
    const adapter = navigator.gpu ? await navigator.gpu.requestAdapter().catch(() => null) : null;
    if (!adapter) {
      note.innerHTML =
        "<div>" + icon + "<b>HaniSculpt</b> needs WebGPU, and this browser " +
        (navigator.gpu ? "has no graphics adapter for it" : "does not have it") + ".<br><br>" +
        "Chrome and Edge on Windows and macOS have it on.<br>" +
        "Chrome on Linux: turn on <code>chrome://flags/#enable-unsafe-webgpu</code> " +
        "and <code>chrome://flags/#enable-vulkan</code>, then restart it.<br>" +
        "Firefox: turn on <code>dom.webgpu.enabled</code> in <code>about:config</code>, then reload.<br>" +
        "Safari 26 has it too.</div>";
    } else {
      try {
        const app = await import("./hanisculpt.js");
        note.remove();
        await app.default();
      } catch (error) {
        // iced runs its event loop by throwing out of `main` on the web: a
        // thrown "Using exceptions for control flow" is the loop starting,
        // not a failure.
        if (!String(error).includes("Using exceptions for control flow")) {
          console.error(error);
          document.body.appendChild(note);
          note.textContent = "HaniSculpt could not start: " + error;
        }
      }
    }
  </script>
</body>
</html>

# SPDX-License-Identifier: AGPL-3.0-only

[workspace]
resolver = "3"
members = ["crates/hani-core", "crates/hani-gpu", "crates/hani-app", "crates/hani-evdev"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/DanielJoyce/hanisculpt"
rust-version = "1.90"

[workspace.dependencies]
hani-core = { path = "crates/hani-core" }
hani-gpu = { path = "crates/hani-gpu" }

bytemuck = { version = "1", features = ["derive"] }
fast-surface-nets = "0.2"
# Randomness for the sign-in nonce. **Already in the graph**: iced pulls winit
# pulls ahash pulls exactly this crate at exactly this version, so naming it
# here adds no code to the build and no second supply chain to audit -- it
# pins what is already compiled. `/dev/urandom` did the job on Linux and does
# not exist on Windows, which is where the nonce test failed.
getrandom = "0.3"
# Raw Input and the HID parsers, for the Windows stylus. **Already in the graph
# on that target** -- winit pulls this same version -- so the cost here is the
# extra feature surface being compiled, not a new crate. Linux and macOS never
# see it.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_Input",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Devices_HumanInterfaceDevice",
] }
# Core Foundation, for the macOS HID reader. **Already in the graph on that
# target** via winit, so this pins what is compiled rather than adding to it.
# IOKit itself is ten `extern` declarations in `raw_hid` and no crate: the
# same trade the nonce made, where a dependency has to be doing something hard
# to be worth it, and retain/release is hard while ten signatures are not.
core-foundation = "0.10"
# Contracts: what a function requires and what it promises, written on the
# function and checked when it runs. Only the `debug_` and `test_` forms are
# used, so a release build compiles none of it and a stamp costs what it
# cost. A procedural macro and nothing at run time; its own dependencies
# (proc-macro2, quote, syn) were in the lockfile already. MPL-2.0, which
# AGPL-3.0 may be combined with.
contracts = "0.6"
# Where a user's settings, data and state belong on each platform, by the
# XDG base directory specification where it is set and each platform's own
# convention where it is not. `paths.rs` did this by hand, correctly, and
# this is here because the maintainer asked for the crate by name: one
# small file an operating system, MIT, and no dependencies of its own.
dir_spec = "0.5"
glam = { version = "0.33", features = ["bytemuck"] }
# Without iced's defaults, and the features used named in `hani-app`'s
# manifest: three of the defaults were unused and cost 54 packages on Linux
# (`docs/DEPENDENCIES.md`, proposal 1).
iced = { version = "0.14", default-features = false }
iced_wgpu = "0.14"
log = "0.4"
# Without its defaults (regex filters, terminal colour, a date library: 13
# packages) to print log lines. `RUST_LOG=info` and `module=level` filters
# still work (`docs/DEPENDENCIES.md`, proposal 2).
env_logger = { version = "0.11", default-features = false }
hani-evdev = { path = "crates/hani-evdev" }
# Native file dialogs. On Linux this is the XDG desktop portal, which is what a
# sandboxed app needs anyway. Its entire dependency set was already in this
# lockfile before it was added -- see the note in hani-app/Cargo.toml.
rfd = "0.17"
pollster = "0.4"
# Property tests: a rule stated for every input and tried on a few hundred
# drawn at random, shrunk to the smallest that breaks it. A dev-dependency
# of hani-core and never part of the application. Without its default
# features, which are a persistence file and a forking runner this has no
# use for.
proptest = { version = "1", default-features = false, features = ["std"] }
rayon = "1"
# `Instant` and `SystemTime` that work in a browser, where the standard
# library's panic on first use. On every other target it re-exports the
# standard library's own, so a native build is unchanged. **Already in the
# graph**: winit pulls this same version. See `docs/WEB.md`.
web-time = "1.1"
# XML and raw DEFLATE, both needed to read a 3MF and both already compiled for
# this workspace before they were named here: roxmltree arrives through
# fontconfig-parser -> fontdb -> cosmic-text, and yazi through swash ->
# cosmic-text, so making them direct dependencies of hani-core costs zero new
# crates. Each has no dependencies of its own, so the worst case if Iced ever
# changes its text stack is that we compile two small leaf crates ourselves.
# Pinned to 0.20 rather than 0.21 because 0.21 is both a new compile and yanked.
roxmltree = "0.20"
rustc-hash = "2"
yazi = "0.2.1"
# Pinned to 27 because iced_wgpu 0.14 depends on wgpu ^27. The shader widget
# hands us a real wgpu::Device and RenderPass, so a different major version
# here would be a different, incompatible type. Bump both together or not at
# all.
wgpu = "27"

# Debug builds of a wgpu application are unusably slow without this. Our own
# crates keep opt-level 1 so backtraces stay readable, dependencies get full
# optimisation because we are not debugging them.
[profile.dev]
opt-level = 1

# Every dependency, the tests' own (proptest and the rest) among them. It
# does not match the workspace's crates.
[profile.dev.package."*"]
opt-level = 3

# The engine is where the tests' time goes: the redistance, the pyramid, the
# mesher and the brushes are all here, under the application's tests as much
# as under its own. Fully optimised, with debug assertions, overflow checks
# and the contracts still live, since those are the profile's and not the
# level's. Asked for by the maintainer on 2026-11-27. Measured that day on
# the build machine, twelve cores, each suite run whole:
#
#   level   the core's unit tests   the application's tests   an edit, rebuilt
#     1           78.3 s                  255.6 s                 55 s
#     2           65.2 s                  231.2 s                 62 s
#     3           57.2 s                  205.6 s                 71 s
#
# "An edit, rebuilt" is one line changed in `Volume::redistance` and then
# the core's tests and the application's built again, the second of two
# rounds. So sixteen seconds more to build after an edit to the core, and
# seventy-one fewer to run the two suites. A backtrace through the core
# still names its inlined frames, from the debug information.
[profile.dev.package.hani-core]
opt-level = 3

[profile.bench]
debug = true
